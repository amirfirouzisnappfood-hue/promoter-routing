<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8650a"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"><title>مسیریاب پروموتر</title></head><body><main id="screen-login" class="screen login"><section class="login-card"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path fill="#e8650a" d="M32 3C20 16 12 31 17 43l-9 12 17-5c14 4 27-13 34-37-10 7-19 9-27 8z"/><circle cx="39" cy="25" r="6" fill="white"/></svg><h1 data-t="loginTitle">ورود پروموتر</h1><form id="login-form"><label for="pin" data-t="pinLabel">کد ورود</label><input id="pin" inputmode="numeric" maxlength="6" pattern="[0-9]{4,6}" autocomplete="one-time-code" required><button class="primary" type="submit" data-t="loginSubmit">ورود</button><p id="login-error" role="alert"></p></form></section></main><main id="screen-map" class="screen hidden"><div id="map" aria-label="نقشه مسیر"></div><header class="topbar"><strong data-t="appTitle">مسیریاب پروموتر</strong><span id="progress-pill">۰/۰</span><button id="theme-toggle" aria-label="تغییر پوسته">◐</button></header><div id="skeleton" class="skeleton" aria-label="در حال بارگذاری"><i></i><i></i></div><section id="panel-route" class="panel"><button id="panel-handle" class="handle" aria-label="باز و بسته کردن فهرست"></button><div class="summary"><div><b id="stat-count">۰</b><small data-t="count">بازدید انتخاب‌شده</small></div><div><b id="stat-time">۰</b><small data-t="time">زمان کل</small></div><div><b id="stat-dist">۰</b><small data-t="distance">مسافت</small></div></div><details id="section-skipped"><summary data-t="missing">نقاط جاافتاده</summary><ul id="skipped-list"></ul></details><ol id="route-list"></ol></section></main><section id="modal-checkin" class="overlay hidden"><div class="dialog"><h2 id="checkin-name"></h2><output id="gps-distance">موقعیت‌یابی…</output><label id="reason-wrap" class="hidden">دلیل<textarea id="reason"></textarea></label><button id="checkin-confirm" class="primary" data-t="confirm">تأیید و ادامه</button><div class="actions"><button id="skip-btn" data-t="skip">رد کردن</button><button id="failed-btn" data-t="failed">ناموفق</button><button id="checkin-cancel" data-t="cancel">انصراف</button></div></div></section><section id="modal-form" class="overlay hidden"><div class="dialog form-dialog"><h2>ثبت اطلاعات بازدید</h2><form id="visit-form"><div id="dynamic-fields"></div><div class="actions"><button class="primary" type="submit" data-t="submit">ثبت بازدید</button><button type="button" id="form-cancel" data-t="cancel">انصراف</button></div></form></div></section><div id="toast-container" aria-live="polite"></div><script defer src="config.js"></script><script defer src="op-solver.js"></script><script defer src="app.js"></script></body></html>
